# Refer https://docs.halo.run/developer-guide/plugin/basics/manifest

apiVersion: plugin.halo.run/v1alpha1
kind: Plugin
metadata:
  # The name defines how the plugin is invoked, A unique name
  name: psyche-echo
spec:
  enabled: true
  requires: ">=2.23.0"
  author:
    name: miany
    website: https://gitee.com/miany
  logo: logo.png
  homepage: https://gitee.com/miany/psyche-echo#readme
  repo: https://gitee.com/miany/psyche-echo
  issues: https://gitee.com/miany/psyche-echo/issues
  displayName: "记录(个人)"
  description: "记录(个人) - Halo 插件"
  license:
    - name: "GPL-3.0"
      url: "https://gitee.com/miany/psyche-echo/blob/main/LICENSE"
  extensionPoints:
    console:
      uiPlugins:
        - entry: main.js